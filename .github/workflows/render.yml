name: Render 2K Remotion Video

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies for Chromium and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libcairo2 libcups2 libdbus-1-3 libdrm2 libexpat1 libfontconfig1 libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release wget xdg-utils

      - name: Install project dependencies
        run: npm install --force

      - name: Align postprocessing with Three.js 0.160.1
        run: npm install --no-save postprocessing@6.36.3 @react-three/postprocessing@2.16.2 --legacy-peer-deps --force

      - name: Render Remotion 2K video
        run: |
          mkdir -p /tmp/remotion-tmp out/ice-carrier
          TEMP=/tmp/remotion-tmp TMP=/tmp/remotion-tmp npx remotion render src/sandboxes/ice-carrier/index.tsx IceCarrierShort out/ice-carrier/video.mp4 --codec h264 --crf 16 --scale 1 --concurrency=1

      - name: Mux audio with video
        run: ffmpeg -y -i out/ice-carrier/video.mp4 -i audio/mix.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k out/ice-carrier/final.mp4

      - name: Upload final 2K video
        uses: actions/upload-artifact@v4
        with:
          name: ice-carrier-2k-final
          path: out/ice-carrier/final.mp4
